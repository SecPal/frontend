worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/secpal-nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/secpal-nginx/client-body;
  proxy_temp_path /tmp/secpal-nginx/proxy;
  fastcgi_temp_path /tmp/secpal-nginx/fastcgi;
  uwsgi_temp_path /tmp/secpal-nginx/uwsgi;
  scgi_temp_path /tmp/secpal-nginx/scgi;

  include /etc/nginx/conf.d/*.conf;
}
