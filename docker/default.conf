server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  autoindex off;

  include /etc/nginx/snippets/secpal-security-headers.conf;

  location = /health/live {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"status":"ok"}';
  }

  location ~ ^/(?:v1|sanctum|health)(?:/|$) {
    return 404;
  }

  location = /runtime-config.js {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    alias /tmp/secpal-runtime/runtime-config.js;
    default_type application/javascript;
    etag off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location ^~ /runtime-config.js/ {
    return 404;
  }

  location = / {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /sw.js {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /document-language.js {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /theme-color.js {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /source-offer.json {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /.well-known/assetlinks.json {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri /assetlinks.json =404;
  }

  location = /assetlinks.json {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location ~ (^|/)\. {
    return 404;
  }

  location ~* ^/assets/.+\.(?:js|css|woff|woff2|png|svg)$ {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|json|md|txt|svg|png|ico|woff|woff2)$ {
    include /etc/nginx/snippets/secpal-security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
