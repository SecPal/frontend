---
name: Frontend Container
"on":
  pull_request:
    branches:
      - main
  workflow_call: {}
permissions:
  contents: read
jobs:
  validate:
    name: Validate frontend build contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact frontend commit
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 6a6758681f4ebc46b4a33d442846d33d6b79785c
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Read exact pinned OCI attestation implementation for offline qualification
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/attest
          ref: 1e69f48acb82d1966a394da916b4c1698aa569d6
          path: .context/pinned-attestation-action
          persist-credentials: false
      - name: Install locked accepted schema validator
        run: 'python3 -m venv "$RUNNER_TEMP/secpal-policy"

          "$RUNNER_TEMP/secpal-policy/bin/pip" install --requirement .context/publisher-governance/requirements/vulnerability-policy.txt

          printf ''%s\n'' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"'
      - name: Install pinned registry CLI for offline compatibility evidence
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Set up Node.js
        # v7.0.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
          cache: npm
      - name: Install dependencies
        run: npm ci --foreground-scripts
      - name: Run publisher and runtime policy tests
        env:
          SECPAL_TEST_ATTEST_BUNDLE: .context/pinned-attestation-action/dist/index.js
          SECPAL_TEST_ORAS: ${{ runner.temp }}/secpal-publisher-tools/oras
        run:
          "npm exec -- vitest --configLoader=native run tests/container-publishing-workflow.test.ts tests/container-contract.test.ts
          tests/container-runtime-lifecycle.test.ts tests/node-toolchain-contract.test.ts src/config.test.ts src/lib/pwaRuntimeCaching.test.ts

          python3 tests/container-publisher.py

          python3 tests/container-attestation-auth.py"
      - name: Lint Containerfile and shell
        run:
          'podman run --rm -i docker.io/hadolint/hadolint:v2.14.0-debian@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2
          < Containerfile

          podman run --rm -v "$PWD:/mnt:ro" -w /mnt docker.io/koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          scripts/*container*.sh docker/*.sh'
  build-and-test:
    name: Native frontend (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact frontend commit
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: source
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 6a6758681f4ebc46b4a33d442846d33d6b79785c
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Install native distribution container tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends buildah podman skopeo uidmap slirp4netns crun
          command -v buildah
          sha256sum "$(command -v buildah)"
          buildah --version
          podman --version
          dpkg-query -W buildah podman skopeo
      - name: Set up Node.js
        # v7.0.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install dependencies
        run: npm ci --foreground-scripts
      - name: Install native Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Install pinned authoritative Syft
        run: scripts/container-tools.sh build "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Build exact source and execute native runtime smoke
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run: scripts/build-container.sh "$NATIVE_ARCH" "$RUNNER_TEMP/secpal-native/$NATIVE_ARCH"
      - name: Retain exact native OCI and SBOM evidence
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secpal-native/${{ matrix.arch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
    defaults:
      run:
        working-directory: source
  container-contract:
    name: Container Contract
    needs:
      - validate
      - build-and-test
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both native architectures
        env:
          VALIDATION: ${{ needs.validate.result }}
          NATIVE: ${{ needs.build-and-test.result }}
        run: 'test "$VALIDATION" = success

          test "$NATIVE" = success'
