---
name: Frontend Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container-contract:
    name: Container Contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Install dependencies
        run: npm ci --foreground-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify source container contracts
        run: >-
          npm exec -- vitest run tests/container-runtime-lifecycle.test.ts
          tests/container-contract.test.ts
          src/config.test.ts src/lib/pwaRuntimeCaching.test.ts

      - name: Build and exercise hardened frontend image
        run: npm run test:container

      - name: Exercise the real container in Chromium
        env:
          SECPAL_CONTAINER_SKIP_BUILD: "1"
        run: npm run test:e2e:container
