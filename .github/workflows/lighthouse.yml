---
name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip for spike branches (exploration only)
    if: ${{ !startsWith(github.head_ref, 'spike/') && !startsWith(github.ref, 'refs/heads/spike/') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.cjs
          temporaryPublicStorage: true

      - name: Upload Lighthouse report
        id: upload_lighthouse_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: error
          include-hidden-files: true

      - name: Format Lighthouse Score
        id: format_lighthouse_score
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        env:
          LIGHTHOUSE_ARTIFACT_URL: ${{ steps.upload_lighthouse_artifact.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find the latest manifest
            const lhciDir = '.lighthouseci';
            if (!fs.existsSync(lhciDir)) {
              console.log('No Lighthouse results found');
              return;
            }

            const files = fs.readdirSync(lhciDir);
            const manifestFile = files.find(f => f.startsWith('manifest') && f.endsWith('.json'));

            if (!manifestFile) {
              console.log('No manifest file found');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(path.join(lhciDir, manifestFile), 'utf8'));

            if (!manifest.length) {
              console.log('Empty manifest');
              return;
            }

            // We test one URL. The report itself is uploaded as a workflow artifact.
            const summary = manifest[0].summary;
            const artifactUrl = process.env.LIGHTHOUSE_ARTIFACT_URL;

            if (!artifactUrl) {
              console.log('No Lighthouse artifact URL found');
              return;
            }

            const formatScore = (score) => {
              const pct = Math.round(score * 100);
              const emoji = pct >= 90 ? '🟢' : pct >= 50 ? '🟡' : '🔴';
              return `${emoji} ${pct}`;
            };

            const comment = [
              '## ⚡ Lighthouse Report',
              '',
              '| Category | Score |',
              '| --- | --- |',
              `| Performance | ${formatScore(summary.performance)} |`,
              `| Accessibility | ${formatScore(summary.accessibility)} |`,
              `| Best Practices | ${formatScore(summary['best-practices'])} |`,
              '',
              `[View full report artifact](${artifactUrl})`,
              '',
              '<details>',
              '<summary>Core Web Vitals</summary>',
              '',
              '- **LCP** (Largest Contentful Paint): Target < 2.5s',
              '- **CLS** (Cumulative Layout Shift): Target < 0.1',
              '- **TBT** (Total Blocking Time): Target < 200ms',
              '',
              '</details>',
            ].join('\n');

            core.setOutput('comment', comment);

      - name: Comment PR with Lighthouse scores
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request' && steps.format_lighthouse_score.outputs.comment
        with:
          script: |
            const comment = `${{ steps.format_lighthouse_score.outputs.comment }}`;

            // Find existing Lighthouse comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('⚡ Lighthouse Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
