---
name: Publish Container
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/released-artifact-security.yml
      - .github/workflows/daily-repository-security.yml
      - tests/released-artifact-security-workflow.test.ts
      - tests/daily-repository-security-workflow.test.ts
      - docs/deployment/frontend-container.md
      - CHANGELOG.md
permissions: {}
concurrency:
  group: publish-container-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false
env:
  GHCR_HOST: ghcr.io
  GHCR_REPOSITORY_PATH: secpal/frontend
  CANONICAL_IMAGE: ghcr.io/secpal/frontend
jobs:
  admit:
    name: Authenticate protected-main publication or qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the exact publisher source and its predecessor
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit successive releases or independently adopted source
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != SecPal/frontend || "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_REF_PROTECTED" != true || ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ||
                "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Cannot authenticate the exact protected-main source.'
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) BEFORE=$(git rev-parse --verify "$GITHUB_SHA^") ;;
            push) ;;
            *) exit 1 ;;
          esac
          if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] ||
                ! git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA"; then
            echo '::error::Cannot authenticate the protected-main publisher predecessor.'
            exit 1
          fi
          mode=$(git ls-tree "$BEFORE" -- scripts/frontend-publisher-admission.sh | cut -d ' ' -f 1)
          if [[ "$mode" != 100644 ]]; then
            echo '::notice::Protected predecessor lacks the verified publisher gate. No release was requested.'
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # Only the candidate graph is reachable after independent source adoption.
            git diff --quiet --no-ext-diff "$BEFORE" "$GITHUB_SHA" -- \
              .github/workflows/quality.yml .github/workflows/reusable-repository-security.yml
            gh api repos/SecPal/frontend/branches/main |
              jq -e --arg sha "$GITHUB_SHA" '
                .protected == true and .commit.sha == $sha and .commit.commit.verification.verified == true
              ' >/dev/null
            gh api "repos/SecPal/frontend/commits/$GITHUB_SHA/pulls?per_page=100" |
              jq -e --arg sha "$GITHUB_SHA" '
                map(select(.state == "closed" and (.merged_at | type) == "string" and .merge_commit_sha == $sha
                  and .base.ref == "main" and .base.repo.full_name == "SecPal/frontend")) | length == 1
              ' >/dev/null
            quality_path=repos/SecPal/frontend/actions/workflows/quality.yml/runs
            gh api "$quality_path?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=30" |
              jq -e --arg sha "$GITHUB_SHA" '
                .workflow_runs | any(.head_sha == $sha and .head_branch == "main" and .event == "push"
                  and .path == ".github/workflows/quality.yml" and .head_repository.full_name == "SecPal/frontend"
                  and .status == "completed" and .conclusion == "success")
              ' >/dev/null
            exit 0
          fi
          git show "$BEFORE:scripts/frontend-publisher-admission.sh" > "$RUNNER_TEMP/publisher-admission.sh"
          bash "$RUNNER_TEMP/publisher-admission.sh" "$BEFORE" "$GITHUB_SHA"

  repository-security:
    name: Repository Security
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-repository-security.yml
  validate:
    name: Validate Frontend Image
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout publishing commit
        id: checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        # v7.0.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
          cache: npm
      - name: Install dependencies
        run: npm ci --foreground-scripts
      - name: Run container publishing and source policy tests
        run:
          npm exec -- vitest --configLoader=native run tests/node-toolchain-contract.test.ts tests/container-runtime-lifecycle.test.ts
          tests/container-publishing-workflow.test.ts tests/repository-security-workflow.test.ts tests/repository-security-reachability.test.ts
          tests/container-contract.test.ts
  build:
    name: Build native Frontend candidates
    needs:
      - validate
      - repository-security
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-container.yml
  pre-registry:
    name: Qualify both exact unpublished OCI subjects
    needs:
      - build
      - repository-security
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      binding: ${{ steps.binding.outputs.binding }}
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 22ce172e7b1decfdd4267e382432b93765798d95
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Install native registry observer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh publish "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Read same-run native artifacts
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: frontend-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/native
      - name: Require exact source evidence identity
        env:
          SOURCE_EVIDENCE_ARTIFACT: ${{ needs.repository-security.outputs.evidence-artifact }}
        run: test -n "$SOURCE_EVIDENCE_ARTIFACT"
      - name: Read exact source security evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: .context/repository-security
          name: ${{ needs.repository-security.outputs.evidence-artifact }}
      - name: Install locked central policy dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/secpal-policy"
          "$RUNNER_TEMP/secpal-policy/bin/pip" install \
            --requirement .context/publisher-governance/requirements/vulnerability-policy.txt
          printf '%s\n' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"
      - name: Evaluate exact unpublished artifacts under the unchanged security policy
        run: scripts/publish-container.sh qualify
      - name: Sign the local qualification binding
        id: qualification-attestation
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .context/publisher/pre-registry.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain the signed qualification binding
        id: binding
        env:
          BUNDLE: ${{ steps.qualification-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE"
          cp -- "$BUNDLE" .context/publisher/pre-registry.bundle.json
          binding=$(sha256sum .context/publisher/pre-registry.json | cut -d ' ' -f 1)
          echo "binding=sha256:$binding" >> "$GITHUB_OUTPUT"
      - name: Retain unpublished qualification evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-pre-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .context/publisher
            .context/scan
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  prepare:
    if: github.event_name == 'push'
    name: Prepare exact digest subjects
    needs:
      - build
      - repository-security
      - pre-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.prepare.outputs.index_digest }}
      amd64_digest: ${{ steps.prepare.outputs.amd64_digest }}
      arm64_digest: ${{ steps.prepare.outputs.arm64_digest }}
      amd64_sbom: ${{ steps.prepare.outputs.amd64_sbom }}
      arm64_sbom: ${{ steps.prepare.outputs.arm64_sbom }}
      amd64_sbom_digest: ${{ steps.prepare.outputs.amd64_sbom_digest }}
      arm64_sbom_digest: ${{ steps.prepare.outputs.arm64_sbom_digest }}
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 22ce172e7b1decfdd4267e382432b93765798d95
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Install native registry observer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Read same-run native artifacts
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: frontend-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/native
      - name: Require exact source evidence identity
        env:
          SOURCE_EVIDENCE_ARTIFACT: ${{ needs.repository-security.outputs.evidence-artifact }}
        run: test -n "$SOURCE_EVIDENCE_ARTIFACT"
      - name: Read exact source security evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: .context/repository-security
          name: ${{ needs.repository-security.outputs.evidence-artifact }}
      - name: Install locked central policy dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/secpal-policy"
          "$RUNNER_TEMP/secpal-policy/bin/pip" install \
            --requirement .context/publisher-governance/requirements/vulnerability-policy.txt
          printf '%s\n' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"
      - name: Read exact unpublished qualification evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend-pre-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/pre-registry
      - name: Publish and independently read exact subjects
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_REGISTRY_BINDING: ${{ needs.pre-registry.outputs.binding }}
        run: scripts/publish-container.sh prepare
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  attest:
    name: Attest candidate index platforms and Syft artifacts
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Select ephemeral attestation credential directory
        run: printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/secpal-attest-auth" >> "$GITHUB_ENV"
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Authenticate exact package for keyless attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'python3 scripts/container-attestation-auth.py prepare

          printf ''%s'' "$GH_TOKEN" | "$RUNNER_TEMP/secpal-publisher-tools/oras" login ghcr.io --registry-config "$DOCKER_CONFIG/config.json"
          --username "$GITHUB_ACTOR" --password-stdin

          chmod 0600 "$DOCKER_CONFIG/config.json"'
      - name: Admit exact job credential to pinned reader
        run: python3 scripts/container-attestation-auth.py install
      - name: Attest exact index
        id: index
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/frontend
          subject-digest: ${{ needs.prepare.outputs.index_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact amd64
        id: amd64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/frontend
          subject-digest: ${{ needs.prepare.outputs.amd64_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact arm64
        id: arm64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/frontend
          subject-digest: ${{ needs.prepare.outputs.arm64_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact sbom-amd64
        id: sbom-amd64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/frontend
          subject-digest: ${{ needs.prepare.outputs.amd64_sbom_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact sbom-arm64
        id: sbom-arm64
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/frontend
          subject-digest: ${{ needs.prepare.outputs.arm64_sbom_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Remove exact ephemeral registry credentials
        if: always()
        run: python3 scripts/container-attestation-auth.py cleanup
  verify:
    name: Published native runtime (${{ matrix.arch }})
    needs:
      - prepare
      - attest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 22ce172e7b1decfdd4267e382432b93765798d95
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Read exact prepared subjects
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: frontend-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          merge-multiple: true
      - name: Install native runtime client
        run: "sudo apt-get update

          sudo apt-get install --yes --no-install-recommends podman uidmap slirp4netns crun"
      - name: Set up Node.js
        # v7.0.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
          cache: npm
      - name: Install dependencies
        run: npm ci --foreground-scripts
      - name: Install native Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Install pinned native GitHub verifier
        run: scripts/container-tools.sh verify "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Verify attestation and execute exact native platform
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARCH: ${{ matrix.arch }}
        run: scripts/publish-container.sh verify "$NATIVE_ARCH"
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-smoke-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/smoke
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    name: Artifact security (${{ matrix.arch }})
    needs:
      - prepare
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 22ce172e7b1decfdd4267e382432b93765798d95
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Read exact prepared subjects
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: frontend-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          merge-multiple: true
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh publish "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Install locked central policy dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/secpal-policy"
          "$RUNNER_TEMP/secpal-policy/bin/pip" install \
            --requirement .context/publisher-governance/requirements/vulnerability-policy.txt
          printf '%s\n' "$RUNNER_TEMP/secpal-policy/bin" >> "$GITHUB_PATH"
      - name: Observe exact artifacts and apply accepted central policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/scan-container-artifact.sh "${{ matrix.arch }}"
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-scans-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/scan
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  accept:
    name: Accept verified Frontend publication
    needs:
      - prepare
      - attest
      - verify
      - scan
      - repository-security
      - pre-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_digest: ${{ needs.prepare.outputs.index_digest }}
      evidence_digest: ${{ steps.retain.outputs.evidence_digest }}
    steps:
      - name: Select ephemeral attestation credential directory
        run: printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/secpal-final-attest-auth" >> "$GITHUB_ENV"
      - name: Checkout exact publisher source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout accepted supply-chain implementation
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SecPal/.github
          ref: 22ce172e7b1decfdd4267e382432b93765798d95
          path: .context/publisher-governance
          persist-credentials: false
          fetch-depth: 0
      - name: Read exact prepared subjects
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: frontend-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          merge-multiple: true
      - name: Read exact native scan evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: frontend-scans-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/scan
          merge-multiple: true
      - name: Read exact native smoke evidence
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: frontend-smoke-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/smoke
      - name: Install pinned publisher tools
        run: scripts/container-tools.sh registry "$RUNNER_TEMP/secpal-publisher-tools"
      - name: Assemble complete builder-independent evidence
        run: scripts/publish-container.sh evidence
      - name: Attest immutable build evidence document
        id: document
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .context/publisher/build-evidence.json
          create-storage-record: false
      - name: Verify exact document and retain its bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.document.outputs.bundle-path }}
        run:
          'gh attestation verify .context/publisher/build-evidence.json --bundle "$BUNDLE" --repo SecPal/frontend
          --signer-workflow SecPal/frontend/.github/workflows/publish-container.yml --signer-digest "$GITHUB_SHA"
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners

          cp "$BUNDLE" .context/publisher/build-evidence.bundle.json'
      - name: Retain immutable evidence by digest
        id: retain
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_REGISTRY_BINDING: ${{ needs.pre-registry.outputs.binding }}
        run: scripts/publish-container.sh retain-evidence
      - name: Authenticate exact package for evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'python3 scripts/container-attestation-auth.py prepare

          printf ''%s'' "$GH_TOKEN" | "$RUNNER_TEMP/secpal-publisher-tools/oras" login ghcr.io --registry-config "$DOCKER_CONFIG/config.json"
          --username "$GITHUB_ACTOR" --password-stdin

          chmod 0600 "$DOCKER_CONFIG/config.json"'
      - name: Admit exact job credential to pinned reader
        run: python3 scripts/container-attestation-auth.py install
      - name: Attest exact build-evidence
        id: build-evidence
        # v4.2.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/secpal/frontend
          subject-digest: ${{ steps.retain.outputs.evidence_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Restore and remove exact evidence attestation credentials
        if: always()
        run: python3 scripts/container-attestation-auth.py cleanup
      - name: Verify all subjects and publish only unique discovery tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DIGEST: ${{ steps.retain.outputs.evidence_digest }}
          PRE_REGISTRY_BINDING: ${{ needs.pre-registry.outputs.binding }}
        run: scripts/publish-container.sh accept "$EVIDENCE_DIGEST"
      - name: Retain bounded publisher evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-accepted-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/publisher
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
