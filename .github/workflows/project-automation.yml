---
name: Project Board Automation

on:
  issues:
    types:
      - opened
      - reopened
      - closed
      - labeled
  pull_request:
    types:
      - opened
      - ready_for_review
      - closed
      - converted_to_draft
      - labeled
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  project-automation:
    name: Project automation
    # main
    uses: SecPal/.github/.github/workflows/project-automation-core.yml@120ab50b76e0039dd8aa85b0dee49861fa7acd10
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  draft-reminder:
    name: Draft PR Reminder
    # main
    uses: SecPal/.github/.github/workflows/draft-pr-reminder.yml@fa88c750f53091e08d051df9c60a2a3c06d5ec03
    permissions:
      issues: write
      pull-requests: write
