---
name: Daily Frontend Repository Security

on:
  schedule:
    - cron: "07 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  admit-source:
    name: Admit protected Frontend main event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact protected main source
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != SecPal/frontend ||
                "$GITHUB_REF" != refs/heads/main || "$GITHUB_REF_PROTECTED" != true ||
                ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Source assessment requires the protected Frontend main event SHA.' >&2
            exit 1
          fi
          printf 'Source subject: %s@%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  repository-security:
    name: Repository Security
    needs: admit-source
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-repository-security.yml
