    name: Check PR Size
    # main; keep this immutable; Dependabot updates reusable-workflow references.
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@24b8bd3ffb73dd91898f4dcd8b20bc3fa2421f51
    with:
      max-lines: 600
