---
name: PR Size Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-size:
    name: Check PR Size
    # Keep this immutable; Dependabot updates reusable-workflow references.
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@5c352f2bf69740bead4228211a5d3dd12a5fc2b1
    with:
      max-lines: 600
