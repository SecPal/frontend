---
name: PR Size Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-size:
    name: Check PR Size
    # main; keep this immutable; Dependabot updates reusable-workflow references.
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@73e2972e8856c8c197152ec3b45a63e49ccb09fe
    with:
      max-lines: 600
