---
name: PR Size Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-size:
    name: Check PR Size
    # main; keep this immutable; Dependabot updates reusable-workflow references.
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@df09a6a5b9e5ea557c92c283be4868001929b59f
    with:
      max-lines: 600
